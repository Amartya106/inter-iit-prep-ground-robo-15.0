# twist_mux: one /cmd_vel out, shared by teleoperation and Nav2.
#
# This is the "same drive interface for manual and autonomous" required by
# Part 1, Phase 1. Priority ordering guarantees a human can always override
# the autonomous stack:
#
#   /cmd_vel_joy    (gamepad)          priority 100
#   /cmd_vel_key    (teleop_twist_kbd) priority  90
#   /cmd_vel_nav    (Nav2 controller)  priority  10
#
# Output -> /cmd_vel -> ros_gz bridge -> gz mecanum-drive-system.
# Downstream of this, nav2_velocity_smoother enforces accel/jerk limits.

twist_mux:
  ros__parameters:
    use_sim_time: true
    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
      keyboard:
        topic: cmd_vel_key
        timeout: 0.5
        priority: 90
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 100
    locks:
      e_stop:
        topic: e_stop
        timeout: 0.0
        priority: 255
