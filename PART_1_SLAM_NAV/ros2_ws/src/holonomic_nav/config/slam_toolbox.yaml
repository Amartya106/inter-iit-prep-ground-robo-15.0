# slam_toolbox (async, online) for the holonomic base in the warehouse world.
#
# Derived from the repo's holonomic_bot/config/mapper_params_online_async.yaml,
# retuned for the large warehouse:
#   - loop_search_maximum_distance 3.0 -> 10.0  (long aisles between revisits)
#   - minimum_travel_distance      0.2 -> 0.15  (denser submaps in open space)
#   - max_laser_range matched to the SDF gpu_lidar (12.0 m)
#
# Frames come from the fixed stack:  map -> odom (this node)
#                                    odom -> base_link (EKF)
#                                    base_link -> lidar_link (robot_state_publisher)

slam_toolbox:
  ros__parameters:
    use_sim_time: true

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    # skip every other scan -- the drive base yaws erratically (fake-mecanum),
    # so back-to-back 10 Hz scans during a lurch were being misregistered and
    # smeared into radial "fan" artefacts. One in two is plenty at these speeds.
    throttle_scans: 2
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # The EKF odometry here is ground-truth-derived (see odom_correction_node),
    # accurate to ~2 cm against Gazebo truth, so the pose-graph prior is
    # already globally consistent. Scan matching is kept *aggressive* -- dense
    # nodes, a wide correlation window, a low fine-match threshold -- so that
    # wherever the 12 m LiDAR actually sees a wall (the robot must be within
    # range), that structure is registered crisply. From the open interior
    # every return is `inf`; those scans only carve free space, which is
    # expected, not a failure.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    scan_buffer_size: 40
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 3.0
    loop_search_maximum_distance: 15.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.32
    loop_match_minimum_response_fine: 0.42

    # NOTE: smear_deviation must stay in [0.005, 0.1] or slam_toolbox aborts.
    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05

    loop_search_space_dimension: 12.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
