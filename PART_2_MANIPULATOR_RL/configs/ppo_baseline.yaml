# PPO baseline for the report's algorithm comparison. Point --config here and
# set --timesteps; phase is overridden per run via a copy or the phase field.
phase: 1
algo: ppo
n_envs: 16
frame_stack: 3
total_timesteps: 10000000
hyperparams:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
