# Phase 2 - Pick and Place.  Fallback iteration 2: PPO from SCRATCH (no
# --warm-start). diagnose_phase2 showed the phase-1-warm-started policy stalled
# the EE ~27 cm from the peg -- it kept "reaching toward goal_pos" (the mid-air
# place target) instead of the peg, and ent_coef 0.008 couldn't unlearn it.
# From scratch, the -d_ee_peg shaping + the wide grasp-approach kernel is the
# same signal that solves phase-1 reaching, so the approach should form.
# Curriculum start 0.7, annealed to 0 over 70% of training.
phase: 2
algo: ppo
n_envs: 16
frame_stack: 3
grasp_curriculum: 0.7
anneal_grasp_curriculum: true
anneal_frac: 0.7
total_timesteps: 3000000
hyperparams:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
