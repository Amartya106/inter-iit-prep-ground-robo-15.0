# Phase 4 -- R4a, first half of the two-stage fix after R3 diverged.
#
# R3 (obstacle_curriculum bolted onto a from-scratch grasp_curriculum run,
# both curricula simultaneous) got WORSE over training, not better:
# collision_rate 0.49 (1.0M) -> 0.67 (1.5M) -> 0.91 (3.0M) -> 0.91 (3.5M) ->
# 0.95 (4.0M), mean episode length collapsing 235 -> 57 steps (of 400 max).
# Sustained, monotonic, not a transient curriculum-transition dip. Diagnosis
# (cross-checked against a second model): the dense grasp-approach reward is
# pure Euclidean distance to the peg's center, obstacle-blind -- as
# obstacles get denser the policy has a strong, confident gradient straight
# through them ("moth to a flame"), and PPO on-policy learning can't cross
# that reward valley to discover a detour once it's converged onto the
# straight-line habit.
#
# The actual historical precedent (E13, phase 2->3) did NOT run grasp and
# obstacle curricula simultaneously from scratch -- it WARM-STARTED an
# obstacle curriculum from an already grasp-competent, zero-obstacle
# checkpoint (phase 2, num_obstacles=0). R1/R2/R3 all deliberately avoided
# warm-starting because the only available phase-3 source was trained under
# the OLD broken grasp weld. This run regenerates that missing zero-obstacle
# source checkpoint FROM SCRATCH under the FIXED physics (E79) -- the
# correct, physics-clean version of the phase-2 step, just for the
# peg_in_hole task (full insertion predicate) instead of pick_place.
#
# num_obstacles/obstacle_min/obstacle_max forced to 0 via cfg_overrides.
# ent_coef 0.008 matches the proven zero-obstacle recipe (phase 2's own
# scratch config) -- the OBSTACLE stage (R4b) is where ent_coef needs to be
# the higher, obstacle-stage-proven 0.01, not here.
#
#   MANIPULARL_TORCH_THREADS=6 .venv_gpu_test/bin/python train.py \
#     --config configs/ppo_phase4_scratch_r4a_zeroobs.yaml \
#     --seed 0 --out-dir runs/phase4_scratch_r4a_zeroobs \
#     > logs/phase4_scratch_r4a_zeroobs.log 2>&1
#
# Decision gate: evaluate.py --phase 4 --algo ppo --cfg-json
# '{"num_obstacles":0,"obstacle_min":0,"obstacle_max":0}' --episodes 200 on
# the final checkpoint. If ever_grasped_rate stays near 0 even with ZERO
# obstacles, the obstacle interaction wasn't the (whole) problem and R4b
# should not be launched blind -- go back to tracing individual episodes
# instead. If it clears >=0.40, proceed to R4b (warm-start + obstacle
# curriculum + ent_coef 0.01).
phase: 4
algo: ppo
n_envs: 12
frame_stack: 3
cfg_overrides:
  num_obstacles: 0
  obstacle_min: 0
  obstacle_max: 0
grasp_curriculum: 0.7
anneal_grasp_curriculum: true
anneal_frac: 0.6
satisficing_proximity: true
risk_seeking_depth: true
total_timesteps: 3000000
hyperparams:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
