# Phase 1 -- Reaching, UR5 (6-DOF) port. Identical hyperparameters to
# configs/ppo_phase1.yaml (KUKA) -- "keep the methods the same" (E69's own
# design principle): reward shaping (manipularl.rewards, reused unmodified)
# and PPO settings are task-level, not robot-level, so there's no reason to
# retune them before seeing whether they transfer as-is.
phase: 1
algo: ppo
n_envs: 16
frame_stack: 3
total_timesteps: 1500000
hyperparams:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.004
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
